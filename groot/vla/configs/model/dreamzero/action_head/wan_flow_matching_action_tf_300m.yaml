# @package _global_
# ~300M trainable image+text-to-video (i2v) DiT for DreamZero.
#
# Inherits the default Wan2.1-I2V-14B base config, which already wires up the i2v path:
#   model_type=i2v, in_dim=36 (latent 16 + first-frame latent concat 20), out_dim=16,
#   concat_first_frame_latent=true, image_encoder_cfg=WanImageEncoder (CLIP), VAE=WanVideoVAE z=16,
#   frame_seqlen=880 (320x176). We override ONLY the DiT size knobs to land at ~300M trainable params.
#
# The DiT trains FROM SCRATCH: at these dims its tensors no longer shape-match any released WAN
# checkpoint, so skip_component_loading=true bypasses the DiT weight load/download. The frozen
# T5 text encoder, CLIP image encoder, and VAE still load (their load happens before the skip gate)
# and are pulled from Wan-AI/Wan2.1-I2V-14B-480P when no local path is given.
#
# Sizing (measured via scripts/smoke_300m.py): ~14.5M params/block + ~17M shared embeddings.
#   num_layers=19 -> 292.7M, =20 -> 307.2M. We use 19 to land just under the ~300M target.
# Constraints: dim % num_heads == 0 and (dim // num_heads) % 2 == 0 (head_dim=128 here). To retune,
# re-run scripts/smoke_300m.py after changing num_layers/ffn_dim (~14.5M per layer at this width).

defaults:
  - wan_flow_matching_action_tf  # 14B i2v base: model_type=i2v, in_dim=36, CLIP, VAE z=16, frame_seqlen=880

train_architecture: full         # from-scratch DiT => full training (never LoRA on random init)

action_head_cfg:
  config:
    skip_component_loading: true # skip DiT load/download; T5 + CLIP + VAE still load (pretrained, frozen)
    diffusion_model_cfg:
      dim: 896
      ffn_dim: 3584              # 4x dim
      num_heads: 7               # head_dim = 896 / 7 = 128
      num_layers: 19             # -> ~292.7M trainable (measured)
