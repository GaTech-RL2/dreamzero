# @package _global_
# RoboTwin data for DreamZero (Wan2.2-TI2V-5B). Thin shim: native RoboTwin HDF5 read via
# egomimic.ricl RoboTwinCorpus -> RoboTwinDreamZeroDataset, reusing the model_specific_transform
# (DreamTransform) + data_collator. NO LeRobot conversion. Pair with:
#   model/dreamzero/action_head=wan_flow_matching_action_tf_wan22_ricl
# Run via groot/vla/experiment/train_robotwin_dreamzero.py (builds held-out eval set).
defaults:
  - _self_

robotwin_root: ???        # a RoboTwin task dir or parent of <task>/data/episode*.hdf5
embed: dinov2             # 'fake' for a no-DINOv2 smoke
eval_frac: 0.2            # held-out fraction of each task's episodes
clip_mode: forward        # X frames from the matched frame onward (forward|centered|even)
clip_stride: 1

# Wan 5B: 160x320 -> latent 10x20 (even), frame_seqlen=50. The VAE does 4x temporal downsample,
# so num_frames=9 -> T_lat=3 latent frames -> 1 generated block -> action_horizon = (T_lat-1)/
# num_frame_per_block * num_action_per_block = 2/2*24 = 24. (General: num_frames=8m+1 ->
# action_horizon = m*24; e.g. 17->48, 33->96.) max_state_dim=64 matches the DiT state_encoder.
image_resolution_width: 320
image_resolution_height: 160
num_frames: 9
action_horizon: 24
state_horizon: 1
max_state_dim: 64
max_action_dim: 32
# local_attn_size = max_chunk_size*num_frame_per_block + 1 = 17 >= generated latent frames,
# so the sliding window never evicts the retrieved-frame prefix (keeps grounding global).
max_chunk_size: 8
use_global_metadata: false

# BaseExperiment asserts cfg.transforms (GR00T per-embodiment EVAL modality transforms) and
# loops over its items. The RoboTwin shim does NOT use GR00T eval transforms — it normalizes
# in the dataset (quantile_norm) and deploys via egomimic.ricl.dreamzero_robotwin_policy +
# quantiles.json. An empty dict satisfies the assert (not None) with a no-op loop.
transforms: {}

train_dataset:
  _target_: groot.vla.data.dataset.robotwin_dreamzero.build_robotwin_dreamzero_split
  split: train
  root: ${robotwin_root}
  transform: ${model_specific_transform}
  num_retrieved_demos: ${num_retrieved_demos}
  frames_per_demo: ${frames_per_demo}
  clip_mode: ${clip_mode}
  clip_stride: ${clip_stride}
  num_frames: ${num_frames}
  action_horizon: ${action_horizon}
  state_horizon: ${state_horizon}
  embed: ${embed}
  eval_frac: ${eval_frac}

eval_dataset:
  _target_: groot.vla.data.dataset.robotwin_dreamzero.build_robotwin_dreamzero_split
  split: eval
  root: ${robotwin_root}
  transform: ${model_specific_transform}
  num_retrieved_demos: ${num_retrieved_demos}
  frames_per_demo: ${frames_per_demo}
  clip_mode: ${clip_mode}
  clip_stride: ${clip_stride}
  num_frames: ${num_frames}
  action_horizon: ${action_horizon}
  state_horizon: ${state_horizon}
  embed: ${embed}
  eval_frac: ${eval_frac}
